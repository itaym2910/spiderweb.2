<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="spiderweb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Background Disc for contrast across light and dark browser themes -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />
  
  <!-- Radial Spokes -->
  <g stroke="url(#spiderweb-grad)" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="5" x2="32" y2="59" />
    <line x1="5" y1="32" x2="59" y2="32" />
    <line x1="13" y1="13" x2="51" y2="51" />
    <line x1="13" y1="51" x2="51" y2="13" />
  </g>
  
  <!-- Concentric Web Rings (Octagons) -->
  <polygon points="32,8 49,15 56,32 49,49 32,56 15,49 8,32 15,15"
    stroke="url(#spiderweb-grad)" stroke-width="2" fill="none" stroke-linejoin="round" opacity="0.9" filter="url(#glow)" />
    
  <polygon points="32,16 43,21 48,32 43,43 32,48 21,43 16,32 21,21"
    stroke="url(#spiderweb-grad)" stroke-width="1.8" fill="none" stroke-linejoin="round" opacity="0.95" />
    
  <polygon points="32,24 38,26 40,32 38,38 32,40 26,38 24,32 26,26"
    stroke="url(#spiderweb-grad)" stroke-width="1.5" fill="none" stroke-linejoin="round" opacity="0.9" />
    
  <!-- Center Node -->
  <circle cx="32" cy="32" r="3" fill="#38bdf8" />
  
  <!-- Accent Nodes on Intersections -->
  <circle cx="32" cy="8" r="2" fill="#60a5fa" />
  <circle cx="56" cy="32" r="2" fill="#60a5fa" />
  <circle cx="32" cy="56" r="2" fill="#60a5fa" />
  <circle cx="8" cy="32" r="2" fill="#60a5fa" />
  <circle cx="49" cy="15" r="2" fill="#38bdf8" />
  <circle cx="49" cy="49" r="2" fill="#38bdf8" />
  <circle cx="15" cy="49" r="2" fill="#38bdf8" />
  <circle cx="15" cy="15" r="2" fill="#38bdf8" />
</svg>
